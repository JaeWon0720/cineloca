# 씨네로케 CI (계획서 15.2, NFR-007, NFR-009)
# PR과 main push마다 백엔드·프론트 검사, Docker 이미지 빌드, 키 유출 검사를 돌린다.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"                  # 팀 표준
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: 패키지 설치
        run: pip install -r requirements-dev.txt
      - name: 코드 검사 (ruff)
        run: ruff check .
      - name: 테스트 (pytest)
        run: python -m pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"                      # 팀 표준
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 패키지 설치
        run: npm ci
      - name: 코드 검사 (oxlint)
        run: npm run lint
      - name: 테스트 (vitest)
        run: npm run test
      - name: 타입 검사 + 빌드 (tsc, vite)
        run: npm run build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password         # CI 빌드용 임시 값(실제 비밀값 아님)
    steps:
      - uses: actions/checkout@v5
      - name: Compose 설정 확인
        run: docker compose config --quiet
      - name: 이미지 빌드
        run: docker compose build

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0                          # 커밋 기록 전체를 검사
      - name: 키 유출 검사 (gitleaks)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --verbose --exit-code 1