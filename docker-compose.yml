# 씨네로케 개발용 Docker Compose (SDD 2.4, NFR-017)
# 서비스 3개: db(PostgreSQL+pgvector), api(FastAPI), web(React+nginx)
# 값은 같은 폴더의 .env에서 읽는다(.env는 Git에 올리지 않음).
name: cineloca

services:
  db:
    image: pgvector/pgvector:pg16          # PostgreSQL 16 + pgvector (ADR-008)
    restart: unless-stopped                # NFR-020 자동 재시작
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cineloca}
      POSTGRES_USER: ${POSTGRES_USER:-cineloca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 값을 .env에 넣어 주세요}
    ports:
      - "127.0.0.1:5432:5432"              # 내 PC에서만 접속 가능
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # 처음 시작할 때 스키마 자동 적재
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend                       # backend/Dockerfile (Python 3.10)
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cineloca}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 값을 .env에 넣어 주세요}@db:5432/${POSTGRES_DB:-cineloca}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs                   # 요청 로그(NFR-005), 컨테이너 안에 7일 보관
    depends_on:
      db:
        condition: service_healthy         # DB가 준비된 뒤 시작
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:                           # API-025: DB까지 정상이면 200
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: ./frontend                      # frontend/Dockerfile (빌드 후 nginx)
    restart: unless-stopped
    depends_on:
      - api                                # nginx가 api 컨테이너 이름을 찾을 수 있게 먼저 시작
    ports:
      - "127.0.0.1:8080:80"                # 브라우저: http://127.0.0.1:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
