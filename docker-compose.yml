# 씨네로케 개발용 Docker Compose (SDD 2.4, NFR-017)
# 서비스 3개: db(PostgreSQL+pgvector), api(FastAPI), web(React+nginx)
# 값은 같은 폴더의 .env에서 읽는다(.env는 Git에 올리지 않음).
name: cineloca

services:
  db:
    image: pgvector/pgvector:pg16          # PostgreSQL 16 + pgvector (ADR-008)
    restart: unless-stopped                # NFR-020 자동 재시작
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cineloca}
      POSTGRES_USER: ${POSTGRES_USER:-cineloca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 값을 .env에 넣어 주세요}
    ports:
      - "127.0.0.1:5432:5432"              # 내 PC에서만 접속 가능
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # 처음 시작할 때 스키마 자동 적재
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend                       # backend/Dockerfile (Python 3.10)
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cineloca}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 값을 .env에 넣어 주세요}@db:5432/${POSTGRES_DB:-cineloca}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_DAILY_LIMIT: ${GEMINI_DAILY_LIMIT:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STAMP_SIGNING_KEY: ${STAMP_SIGNING_KEY:-}   # F5 서명 키(ADR-009). 비우면 방문 인증만 503
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}   # TourAPI 주변 시설(FR-414). 응답은 저장 안 함
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}   # 관리자 비밀번호 해시(FR-615). 비우면 관리 API만 503
      SYNC_INTERVAL_DAYS: ${SYNC_INTERVAL_DAYS:-7}   # 관리자 화면에 보여 줄 정기 동기화 주기(FR-616)
      LOG_DIR: /app/logs                   # 요청 로그(NFR-005), 7일 보관
    volumes:
      - api-logs:/app/logs                 # 재빌드해도 요청 로그가 7일 남게(#39 리뷰)
    depends_on:
      db:
        condition: service_healthy         # DB가 준비된 뒤 시작
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:                           # API-025: DB까지 정상이면 200
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # C1 배치 감시(API-021, FR-616, ADR-012): 관리자 동기화 요청을 1분 안에 실행하고 정기 동기화를 돌린다.
  # 외부 API를 부르므로 기본으로는 켜지 않는다. 켜기: docker compose --profile batch up -d batch
  batch:
    build: ./backend
    profiles: ["batch"]
    restart: unless-stopped
    command: ["python", "-m", "app.batch", "--watch"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cineloca}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 값을 .env에 넣어 주세요}@db:5432/${POSTGRES_DB:-cineloca}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      KMDB_SERVICE_KEY: ${KMDB_SERVICE_KEY:-}
      JUSO_SEARCH_API_KEY: ${JUSO_SEARCH_API_KEY:-}
      JUSO_COORD_API_KEY: ${JUSO_COORD_API_KEY:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      GEOCODE_KAKAO_KEYWORD: ${GEOCODE_KAKAO_KEYWORD:-false}
      SYNC_INTERVAL_DAYS: ${SYNC_INTERVAL_DAYS:-7}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend                  # frontend/Dockerfile (빌드 후 nginx)
      args:
        VITE_KAKAO_JS_KEY: ${VITE_KAKAO_JS_KEY:-}   # 빌드 때 화면 코드에 들어감(공개 키, 도메인 제한)
    restart: unless-stopped
    depends_on:
      - api                                # nginx가 api 컨테이너 이름을 찾을 수 있게 먼저 시작
    ports:
      - "127.0.0.1:8080:80"                # 브라우저: http://127.0.0.1:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
  api-logs:
