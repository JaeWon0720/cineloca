# 씨네로케 개발용 Docker Compose (SDD 2.4, NFR-017)
# Phase 3-1: db만 정의. api·web은 다음 단계에서 추가한다.
# 값은 같은 폴더의 .env에서 읽는다(.env는 Git에 올리지 않음).
name: cineloca

services:
  db:
    image: pgvector/pgvector:pg16          # PostgreSQL 16 + pgvector (ADR-008)
    restart: unless-stopped                # NFR-020 자동 재시작
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cineloca}
      POSTGRES_USER: ${POSTGRES_USER:-cineloca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 값을 .env에 넣어 주세요}
    ports:
      - "127.0.0.1:5432:5432"              # 내 PC에서만 접속 가능
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # 처음 시작할 때 스키마 자동 적재
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
