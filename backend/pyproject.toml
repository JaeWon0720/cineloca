# 도구 설정 전용 파일입니다. 패키지 설치는 requirements*.txt로 합니다.
[project]
name = "cineloca-backend"
version = "0.1.0"
requires-python = ">=3.10,<3.11"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
